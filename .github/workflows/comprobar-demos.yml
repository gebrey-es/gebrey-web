name: Comprobar las demos

# Abre, desde fuera, la demo sin cuenta de cada proyecto que enlaza gebrey.es y dice si responde, sin
# cambiar nada. Para las que tienen interruptor (GR Gestor y GR Gestor Plus), dice además si está abierta.
on:
  workflow_dispatch:

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Demos
        run: |
          fallos=0
          pagina() { # nombre, dirección
            codigo=$(curl -sS -L -o /tmp/pagina --max-time 30 -w "%{http_code}" "$2" || echo 000)
            titulo=$(grep -o '<title>[^<]*' /tmp/pagina 2>/dev/null | head -n1 | sed 's/<title>//')
            printf '%-34s %s → HTTP %s · %s\n' "$1" "$2" "$codigo" "${titulo:-sin título}"
            [ "$codigo" = 200 ] || { echo "::error::$1 no responde ($2)"; fallos=$((fallos + 1)); }
          }
          enlaza() { # nombre, página, enlace que tiene que llevar
            if curl -sS -L --max-time 30 "$2" 2>/dev/null | grep -qF "$3"; then
              printf '%-34s %s → enlaza %s\n' "$1" "$2" "$3"
            else
              echo "::error::$1: $2 no enlaza $3"; fallos=$((fallos + 1))
            fi
          }
          interruptor() { # nombre, dirección de /api/demo
            respuesta=$(curl -sS --max-time 30 "$2" || true)
            printf '%-34s %s → %s\n' "$1" "$2" "$respuesta"
            case "$respuesta" in *'"abierta":true'*) ;; *) echo "::warning::$1: la demo no está abierta"; esac
          }
          pagina "ViaConextaHub" https://app.conexta.es/demo
          pagina "AppEquipo (por sectores)" https://mbtenerife.es/demostracion/
          pagina "AppEquipo (el portal)" https://mbtenerife.es/demo/
          pagina "Citras" https://mbtenerife.es/ambulancias/
          pagina "AppEquipo Fichajes" https://fichajes.appequipo.es/demo/
          pagina "GR Gestor" https://grgestor.es/app/demo/autonomo
          pagina "GR Gestor Despacho" https://grgestor.es/despacho/demo/gestoria
          interruptor "GR Gestor (interruptor)" https://api.grgestor.es/api/demo
          pagina "GR Gestor (demo.grgestor.es)" https://demo.grgestor.es/app/demo/autonomo
          interruptor "demo.grgestor.es" https://demo.grgestor.es/api/demo
          pagina "GR Gestor Plus" https://plus.grgestor.es/app/demo/administrador
          pagina "GR Fichajes" https://plus.grgestor.es/fichajes/demo/empleado
          interruptor "GR Gestor Plus (interruptor)" https://plus.grgestor.es/api/demo
          # Las webs llevan a la demo de AppEquipo Fichajes (el registro de jornada con la gestoría).
          enlaza "gebrey.es (Jornada)" https://gebrey.es/ https://fichajes.appequipo.es/demo/
          enlaza "mbtenerife.es (con tu gestoría)" https://mbtenerife.es/registro-de-jornada/ https://fichajes.appequipo.es/demo/
          [ "$fallos" = 0 ] || exit 1
